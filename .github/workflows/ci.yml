name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant --
# cancel it rather than paying for both and waiting on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Runs inside the exact base image the Dockerfile's own zig-build stage
    # uses (Alpine + apk postgresql-dev/olm-dev) rather than guessing
    # Ubuntu-equivalent package names -- this is the one build environment
    # already proven to work for this project.
    container: alpine:3.22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warden_test
          POSTGRES_PASSWORD: warden_test
          POSTGRES_DB: warden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Store-layer tests skip (not fail) without this set -- see
      # store/test_support.zig's openTestDb doc comment.
      WARDEN_TEST_POSTGRES_DSN: postgresql://warden_test:warden_test@postgres:5432/warden_test
    steps:
      - name: Install build dependencies
        run: apk add --no-cache bash git curl xz postgresql-dev olm-dev

      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          ZIG_VERSION=0.16.0
          curl -fSL --retry 5 --retry-delay 2 --retry-all-errors -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xJf /tmp/zig.tar.xz -C /opt
          mv "/opt/zig-x86_64-linux-${ZIG_VERSION}" /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: zig fmt --check
        run: zig fmt --check .

      - name: zig build
        run: zig build

      # This step is expected to be GREEN. It was not, from this workflow's
      # creation until 2026-08-04: every run crashed, and the note that used
      # to live here catalogued the crashes as known-and-tolerated, in
      # store/crypto.zig, features/briefing.zig or http_util.zig depending
      # on the run. All three were one bug, and none of them were in the
      # test that got blamed -- http_util.zig's timeout test detached a
      # thread that went on using an `http.Client` and an allocator owned by
      # a stack frame that had already died, then faulted ~30s later,
      # aborting whichever unrelated test happened to hold the main thread
      # at that moment. Fixed by giving the detached thread sole ownership
      # of everything it touches (see http_util.zig's module doc).
      #
      # So: a crash here is a real failure. Do not re-run hoping it passes,
      # and do not add it to a tolerated list. If a test aborts in a module
      # that has no plausible connection to your change, suspect another
      # detached thread rather than that module -- `coredumpctl info <pid>`
      # names the actually-faulting thread, which is the fastest way to tell
      # a real regression from a misattributed one.
      - name: zig build test
        run: zig build test
