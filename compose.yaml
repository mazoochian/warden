services:
  warden:
    image: warden:latest
    # `build` is only used where the source tree exists (your desktop).
    # On the router, `docker load` the saved image first; compose then
    # finds warden:latest locally and never needs to build or pull.
    # `network: host` makes build-time RUNs resolve DNS through the host,
    # where Tailscale MagicDNS works; bridge-networked build containers
    # can't reach the 100.100.100.100 resolver Docker copies from the host.
    build:
      context: .
      network: host
    platform: linux/amd64
    restart: unless-stopped
    # Reap Chromium zombie processes left behind by mermaid-cli renders.
    init: true
    volumes:
      - ./.env:/app/.env:ro
      # No chat/message data lives here anymore (that's WARDEN_POSTGRES_DSN,
      # an external managed Postgres instance — set it in .env, no compose
      # service for it) — this now only persists WARDEN_TMP_DIR's scratch
      # files across restarts.
      - ./data:/app/data
    # No sidecar services are bundled here on purpose — this is the core
    # bot alone, so you decide what (if anything) else to run alongside
    # it. See examples/ for optional sidecars (SearXNG for web search, a
    # self-hosted LLM, whisper.cpp for voice transcription, a Prosody
    # instance for XMPP development), each with its own compose.yaml
    # fragment you merge in explicitly, e.g.:
    #
    #   docker compose -f compose.yaml -f examples/searxng/compose.yaml up -d
    #
    # or, to run several at once:
    #
    #   docker compose \
    #     -f compose.yaml \
    #     -f examples/searxng/compose.yaml \
    #     -f examples/llama-server/compose.yaml \
    #     up -d
