# Optional sidecar: a self-hosted XMPP server for developing/testing the
# XMPP connector (see README's "XMPP" section). Not part of the default
# deployment; merge this file in explicitly:
#
#   docker compose -f compose.yaml -f examples/prosody/compose.yaml up -d
#
# Test-only config (see config/prosody.cfg.lua): self-signed TLS, SASL
# PLAIN via internal_plain storage.
services:
  prosody:
    # `:latest` resolves to 0.11.9 (2019) as of this writing, whose bundled
    # LuaSec/OpenSSL couldn't complete a TLS 1.3 handshake with Zig 0.16's
    # `std.crypto.tls.Client` (its ClientHello offers a hybrid ML-KEM768
    # post-quantum key share by default, with no Options field to disable
    # it -- confirmed via `TlsUnexpectedMessage` failing consistently against
    # 0.11.9 while a plain Python `ssl` client succeeded against the same
    # server). `:trunk` resolved this -- a real server-version compatibility
    # gap, not a bug in the connector.
    image: prosody/prosody:trunk
    restart: unless-stopped
    volumes:
      - ./examples/prosody/config:/etc/prosody
      - ./examples/prosody/data:/var/lib/prosody
    # Published to the host (not just the compose network) so a real XMPP
    # client (Gajim/Dino) and the manual openssl/SASL sanity check can
    # reach it during development from outside the compose network too.
    ports:
      - "5222:5222"
